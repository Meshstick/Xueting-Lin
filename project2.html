<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project One — Mill</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #dff0fe;
      color: #1e293b;
      line-height: 1.6;
      padding: 3rem 1.5rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: #1e293b;
      text-decoration: none;
      font-weight: 500;
      background: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(30, 41, 59, 0.06);
      transition: transform 0.2s ease;
    }

    .back-link:hover {
      transform: translateX(-3px);
    }

    .project-detail {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(30, 41, 59, 0.08);
    }

    .image-placeholder {
      width: 100%;
      height: 360px;
      background-color: #cbe5fd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-size: 1rem;
    }

    .project-detail img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 2rem;
    }

    .content h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #1e293b;
    }

    .content p {
      color: #475569;
      font-size: 1.05rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Portfolio</a>

    <article class="project-detail">
      <!-- To add a picture: delete the div below and uncomment the img tag -->
      <div class="image-placeholder">Project 1 Large Image</div>
      <!-- <img src="project1.jpg" alt="Project 1"> -->

      <div class="content">
        <h1>Project One</h1>
        <p>Write about your project here. You can explain what you built, what tools you used, or what you learned.</p>
      </div>
    </article>
  </div>

</body>
</html>
