<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mill — Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #dff0fe;
      color: #1e293b;
      line-height: 1.6;
      padding: 3.5rem 1.5rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.75rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 1.15rem;
      color: #475569;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.06);
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(30, 41, 59, 0.12);
    }

    .image-placeholder {
      width: 100%;
      height: 210px;
      background-color: #cbe5fd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-size: 0.9rem;
    }

    .project-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .project-info {
      padding: 1.25rem;
      text-align: center;
    }

    .project-info h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mill</h1>
      <p>Student</p>
    </header>

    <main class="projects-grid">
      
      <!-- Project 1 -->
      <a href="project1.html" class="project-card">
        <div class="image-placeholder">Project 1 Image</div>
        <!-- <img src="project1.jpg" alt="Project 1"> -->
        <div class="project-info">
          <h2>Project One</h2>
        </div>
      </a>

      <!-- Project 2 -->
      <a href="project2.html" class="project-card">
        <div class="image-placeholder">Project 2 Image</div>
        <!-- <img src="project2.jpg" alt="Project 2"> -->
        <div class="project-info">
          <h2>Project Two</h2>
        </div>
      </a>

      <!-- Project 3 -->
      <a href="project3.html" class="project-card">
        <div class="image-placeholder">Project 3 Image</div>
        <!-- <img src="project3.jpg" alt="Project 3"> -->
        <div class="project-info">
          <h2>Project Three</h2>
        </div>
      </a>

    </main>
  </div>

</body>
</html>
